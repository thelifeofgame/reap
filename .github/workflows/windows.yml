name: Windows

on:
  push:
    paths: ["windows/**", "spec/**", ".github/workflows/windows.yml"]
  pull_request:
    paths: ["windows/**", "spec/**", ".github/workflows/windows.yml"]
  workflow_dispatch:
    inputs:
      version:
        description: "版本号"
        default: "0.1.0"

jobs:
  build:
    runs-on: windows-latest
    strategy:
      matrix:
        arch: [x64, arm64]
    defaults:
      run:
        working-directory: windows
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: 安装 Inno Setup
        run: |
          if (-not (Test-Path "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe")) { choco install innosetup -y --no-progress }
        shell: pwsh

      - name: 测试并打包
        run: ./scripts/publish.ps1 -Version "${{ github.event.inputs.version || '0.1.0' }}" -Arch ${{ matrix.arch }}
        shell: pwsh

      - uses: actions/upload-artifact@v4
        with:
          name: Reap-windows-${{ matrix.arch }}
          path: |
            windows/dist/*.zip
            windows/dist/*.exe
          if-no-files-found: error
